requires-python = ">=3.10"
dependencies = [
    "flask==3.0.0",
    "flask-sqlalchemy==3.1.1",
    "flask-login==0.6.3",
    "flask-wtf==1.2.1",
    "wtforms==3.1.1",
    "flask-limiter==3.5.0",
    "python-dotenv==1.0.1",
    "reportlab==4.0.9",
    "arabic-reshaper==3.0.0",
    "python-bidi==0.4.2",
    "pillow>=10.4.0",
