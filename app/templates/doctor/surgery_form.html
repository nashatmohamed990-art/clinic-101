{% extends "base_en.html" %}
{% block title %}{% if surgery %}Edit{% else %}Add{% endif %} Surgery - {{ patient.full_name }}{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('doctor.patient_detail', patient_id=patient.id) }}" class="w-9 h-9 bg-gray-100 rounded-lg flex items-center justify-center hover:bg-gray-200 transition">
        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <div>
        <h1 class="text-xl font-bold text-navy-900">{% if surgery %}Edit{% else %}Schedule{% endif %} Surgery</h1>
        <p class="text-sm text-gray-500">{{ patient.full_name }}</p>
    </div>
</div>

<form method="POST" action="{{ url_for('doctor.edit_surgery', surgery_id=surgery.id) if surgery else url_for('doctor.add_surgery', patient_id=patient.id) }}" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 max-w-2xl space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Surgery Type / Name *</label>
        <input type="text" name="surgery_type" required value="{{ surgery.surgery_type or '' }}"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
            placeholder="e.g. Laparoscopic Cholecystectomy">
    </div>
    <div class="grid grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Planned Date *</label>
            <input type="date" name="planned_date" required value="{{ surgery.planned_date.strftime('%Y-%m-%d') if surgery else '' }}"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Planned Time</label>
            <input type="time" name="planned_time" value="{{ surgery.planned_time or '' }}"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
        </div>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select name="status" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            <option value="scheduled" {% if surgery and surgery.status == 'scheduled' %}selected{% endif %}>Scheduled</option>
            <option value="done" {% if surgery and surgery.status == 'done' %}selected{% endif %}>Done</option>
            <option value="cancelled" {% if surgery and surgery.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            <option value="postponed" {% if surgery and surgery.status == 'postponed' %}selected{% endif %}>Postponed</option>
        </select>
    </div>
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Pre-operative Notes</label>
        <textarea name="pre_op_notes" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ surgery.pre_op_notes or '' }}</textarea>
    </div>
    {% if surgery %}
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Post-operative Notes</label>
        <textarea name="post_op_notes" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ surgery.post_op_notes or '' }}</textarea>
    </div>
    {% endif %}
    <div class="flex gap-3 pt-2">
        <button type="submit" class="px-6 py-2.5 bg-teal-600 text-white rounded-xl font-medium hover:bg-teal-700 transition">Save Surgery</button>
        <a href="{{ url_for('doctor.patient_detail', patient_id=patient.id) }}" class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">Cancel</a>
    </div>
</form>
{% endblock %}
