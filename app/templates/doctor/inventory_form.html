{% extends "base_en.html" %}
{% block title %}{% if item %}Edit Item{% else %}Add Item{% endif %} - {{ clinic_name_en }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <a href="{{ url_for('doctor.inventory') }}" class="text-teal-600 hover:text-teal-700 text-sm inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            Back to Inventory
        </a>
        <h2 class="text-xl font-bold text-navy-900 mt-2">{% if item %}Edit Item{% else %}Add Item{% endif %}</h2>
    </div>

    <form method="POST" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Item Name *</label>
            <input type="text" name="name" required value="{{ item.name if item else '' }}"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                placeholder="e.g. Surgical scissors / Diclac ampoules">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Category *</label>
                <select name="category" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                    {% for key, label in categories.items() %}
                    <option value="{{ key }}" {% if item and item.category == key %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Branch *</label>
                <select name="branch" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                    {% for b in branches %}
                    <option value="{{ b.key }}" {% if item and item.branch == b.key or (not item and loop.first) %}selected{% endif %}>{{ b.name_en }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Quantity *</label>
                <input type="number" name="quantity" min="0" required value="{{ item.quantity if item else 0 }}"
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Unit</label>
                <input type="text" name="unit" value="{{ item.unit if item else '' }}" placeholder="pcs, ampoule..."
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Alert below</label>
                <input type="number" name="minimum_quantity" min="0" value="{{ item.minimum_quantity if item else 0 }}"
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Expiry Date <span class="text-gray-400">(medicines/injections)</span></label>
            <input type="date" name="expiry_date" value="{{ item.expiry_date.strftime('%Y-%m-%d') if item and item.expiry_date else '' }}"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
            <textarea name="notes" rows="2"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-none">{{ item.notes if item else '' }}</textarea>
        </div>

        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2.5 rounded-xl transition">
            {% if item %}Save Changes{% else %}Add Item{% endif %}
        </button>
    </form>
</div>
{% endblock %}
