{% extends "base_en.html" %}
{% block title %}Book Appointment - {{ clinic_name_en }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-xl font-bold text-navy-900 mb-6">Book Appointment</h1>

    <form method="POST" action="{{ url_for('doctor.book_appointment_page') }}" class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label>
                <input type="text" name="full_name" required value="{{ request.form.get('full_name', '') }}"
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                    placeholder="Patient full name">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone *</label>
                <input type="tel" name="phone" required value="{{ request.form.get('phone', '') }}"
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition"
                    placeholder="01xxxxxxxxx">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Age *</label>
                    <input type="number" name="age" required min="1" max="150" value="{{ request.form.get('age', '') }}"
                        class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Gender *</label>
                    <select name="gender" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                        <option value="">Select</option>
                        <option value="ذكر">Male</option>
                        <option value="أنثى">Female</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Branch *</label>
                <select name="branch" id="branchSelect" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                    {% for b in branches %}
                    <option value="{{ b.key }}">{{ b.name_en }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                <input type="date" name="appointment_date" id="apptDate" required
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Time Slot *</label>
                <select name="time_slot" id="timeSlot" required class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
                    <option value="">Select date first</option>
                </select>
            </div>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Complaint / Notes</label>
            <textarea name="complaint" rows="2" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm" placeholder="Optional patient complaint"></textarea>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="px-6 py-2.5 bg-teal-600 text-white rounded-xl font-medium hover:bg-teal-700 transition">Book & Confirm</button>
            <a href="{{ url_for('doctor.appointments') }}" class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">Cancel</a>
        </div>
    </form>
</div>

<script>
document.getElementById('apptDate').min = new Date().toISOString().split('T')[0];
function loadDoctorSlots() {
    const dateVal = document.getElementById('apptDate').value;
    const branchVal = document.getElementById('branchSelect').value;
    const slotSelect = document.getElementById('timeSlot');
    if (!dateVal) return;
    slotSelect.innerHTML = '<option value="">Loading...</option>';
    fetch('/slots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ date: dateVal, branch: branchVal })
    })
    .then(r => r.json())
    .then(data => {
        slotSelect.innerHTML = '<option value="">Select time</option>';
        if (data.slots) {
            data.slots.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                slotSelect.appendChild(opt);
            });
            if (data.slots.length === 0) {
                const opt = document.createElement('option');
                opt.value = ''; opt.textContent = `Fully booked (${data.waitlist_count || 0} on waitlist)`;
                slotSelect.appendChild(opt);
            }
        }
    });
}
document.getElementById('apptDate').addEventListener('change', loadDoctorSlots);
document.getElementById('branchSelect').addEventListener('change', loadDoctorSlots);
</script>
{% endblock %}
