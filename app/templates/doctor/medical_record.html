{% extends "base_en.html" %}
{% block title %}Medical Record - {{ patient.full_name }}{% endblock %}

{% block content %}
<div class="flex items-center gap-3 mb-6">
    <a href="{{ url_for('doctor.patient_detail', patient_id=patient.id) }}" class="w-9 h-9 bg-gray-100 rounded-lg flex items-center justify-center hover:bg-gray-200 transition">
        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
    </a>
    <div>
        <h1 class="text-xl font-bold text-navy-900">Medical Record</h1>
        <p class="text-sm text-gray-500">{{ patient.full_name }} &middot; #{{ patient.id }}</p>
    </div>
</div>

<form method="POST" action="{{ url_for('doctor.medical_record', patient_id=patient.id) }}" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Personal Information</label>
            <textarea name="personal_info" rows="4" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.personal_info or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Medical History</label>
            <textarea name="medical_history" rows="4" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.medical_history or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Complaint</label>
            <textarea name="current_complaint" rows="4" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.current_complaint or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Clinical Examination</label>
            <textarea name="clinical_examination" rows="4" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.clinical_examination or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Diagnosis</label>
            <textarea name="diagnosis" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.diagnosis or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Investigations Ordered</label>
            <textarea name="investigations" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.investigations or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Treatment Plan</label>
            <textarea name="treatment_plan" rows="4" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.treatment_plan or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Follow-up Notes</label>
            <textarea name="follow_up_notes" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.follow_up_notes or '' }}</textarea>
        </div>
    </div>
    <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Additional Notes</label>
        <textarea name="additional_notes" rows="3" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition resize-y text-sm">{{ record.additional_notes or '' }}</textarea>
    </div>
    <div class="flex gap-3">
        <button type="submit" class="px-6 py-2.5 bg-teal-600 text-white rounded-xl font-medium hover:bg-teal-700 transition">Save Record</button>
        <a href="{{ url_for('doctor.patient_detail', patient_id=patient.id) }}" class="px-6 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">Cancel</a>
    </div>
</form>
{% endblock %}
