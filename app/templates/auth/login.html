{% extends "base_ar.html" %}
{% block title %}تسجيل الدخول - {{ clinic_name_ar }}{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center -mx-4 px-4 py-10 bg-gradient-to-br from-primary-50 via-white to-accent-50 rounded-3xl">
    <div class="bg-white rounded-2xl shadow-xl border border-primary-100 p-8 w-full max-w-sm">
        <div class="text-center mb-6">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="{{ clinic_name_ar }}"
                class="w-20 h-20 rounded-full ring-4 ring-primary-100 shadow-md mx-auto mb-3">
            <h2 class="text-xl font-bold text-gray-800">تسجيل الدخول</h2>
            <p class="text-gray-500 text-sm mt-1">دخول الموظفين والأطباء فقط</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg text-sm mb-4 border border-red-200">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1.5">اسم المستخدم</label>
                <input type="text" name="username" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition text-right"
                    placeholder="أدخل اسم المستخدم" autofocus>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1.5">كلمة المرور</label>
                <input type="password" name="password" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition text-right"
                    placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" class="w-full bg-primary-600 hover:bg-primary-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm">
                دخول
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{{ url_for('patient.booking_page') }}" class="text-primary-600 hover:text-primary-700 text-sm">← العودة لحجز المواعيد</a>
        </div>
    </div>
</div>
{% endblock %}
