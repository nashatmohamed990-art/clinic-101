{% extends "base_en.html" %}
{% block title %}Change Password - {{ clinic_name_en }}{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto">
    <h2 class="text-xl font-bold text-gray-800 mb-6">Change Password</h2>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3 mb-4">{{ error }}</div>
    {% endif %}

    <form method="POST" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Current Password</label>
            <input type="password" name="current_password" required
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" name="new_password" required minlength="8"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            <p class="text-xs text-gray-400 mt-1">At least 8 characters.</p>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
            <input type="password" name="confirm_password" required minlength="8"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
        </div>
        <button type="submit" class="w-full bg-navy-800 hover:bg-navy-900 text-white font-semibold py-2.5 rounded-xl transition">
            Update Password
        </button>
    </form>
</div>
{% endblock %}
